name: Playwright Automation Using Python

on:
  push:
    branches:
      - "main"
      - "featureTestBranch"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Cache Playwright browsers (BIG time saver)
    - name: Cache Playwright Browsers
      uses: actions/cache@v3
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright
        restore-keys: |
          ${{ runner.os }}-playwright

    # 2. Python setup + pip cache already enabled
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    # 3. Install dependencies (fast because pip is cached)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-xdist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Install Playwright browsers only if cache miss
    - name: Install Playwright Browsers
      run: playwright install --with-deps

    # 5. Run tests in parallel (HUGE speed boost)
    - name: Run Tests
      run: pytest -n 2

    # 6. Upload reports
    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results

    - name: Upload HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: html-report
        path: html_reports/report.html

    - name: Upload Logs
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: logs
