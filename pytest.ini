[pytest]
addopts =
    -s -v
    --base-url=https://opensource-demo.orangehrmlive.com
    --clean-alluredir
    --alluredir=allure-results
    --reruns 1
    --reruns-delay 2
    --html=html_reports/report.html
    --self-contained-html

log_cli = false
log_cli_level = INFO
testpaths = tests

markers =
    smoke: quick checks for core functionality
    regression: full regression suite
    api: API‑only tests
    ui: UI or browser‑based tests
