[pytest]
addopts = -s -v --alluredir=allure-results -n 2 --reruns 2 --reruns-delay 2
log_cli = true
log_cli_level = INFO
testpaths = tests

markers =
    smoke: quick checks for core functionality
    regression: full regression suite
    api: API‑only tests
    ui: UI or browser‑based tests
    critical: high‑priority tests that must always pass
    slow: long‑running tests